name: ci
on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (tsc no-emit + build)
        run: npm run build
      - name: Tests (incl. e2e Chromium)
        run: npm test
        env:
          CI: '1'
      - name: Smoke (register against fake registry)
        run: node scripts/smoke.mjs
